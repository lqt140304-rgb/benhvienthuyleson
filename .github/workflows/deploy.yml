# Tự dựng web bằng Astro và đưa lên GitHub Pages mỗi khi nhánh main thay đổi
# (kể cả khi lưu bài từ trang quản trị /admin), và mỗi sáng 6:00 (giờ Việt Nam) để cập nhật đánh giá Google.
name: Dựng và đưa web lên

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lấy đánh giá Google Maps
        run: node scripts/lay-danh-gia.mjs
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
